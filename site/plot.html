<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TESIS — plot viewer</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --border: #e3e6ea;
      --text: #1f2430;
      --muted: #5b6472;
      --accent: #0f6f9f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    header {
      background: #10212e;
      color: #fff;
      padding: 1.5rem;
    }
    header h1 { margin: 0 0 .3rem; font-size: 1.5rem; }
    header p { margin: 0; color: #c9d4dd; }
    header a { color: #7fdcff; }
    .wrap { max-width: 1300px; margin: 0 auto; padding: 1.5rem; }
    .group { margin-bottom: 2rem; }
    .group h2 {
      font-size: 1rem;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: .4rem;
      margin: 0 0 .9rem;
    }
    .group h2 .count { color: var(--muted); font-weight: 400; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }
    .card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: border-color .15s, transform .15s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card img {
      display: block;
      width: 100%;
      height: 150px;
      object-fit: cover;
      object-position: top;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    .card .label {
      padding: .55rem .7rem;
      font-size: .85rem;
      word-break: break-all;
    }
    .card .label .ext { color: var(--muted); }
    .empty { color: var(--muted); }
    footer { text-align: center; color: var(--muted); font-size: .85rem;
             padding: 0 1.5rem 2rem; }
    code { background: #eef1f4; padding: .1rem .35rem; border-radius: 4px; }
    a { color: var(--accent); }
    header h1 { margin: 0; font-size: 1.1rem; word-break: break-all; }
    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: .75rem; margin-bottom: 1rem;
    }
    .nav { display: flex; gap: .5rem; }
    .nav a, .nav span {
      padding: .45rem .85rem; border-radius: 7px;
      border: 1px solid var(--border); background: var(--card);
      text-decoration: none; color: var(--accent); font-size: .9rem;
    }
    .nav span { color: var(--muted); background: transparent; }
    .counter { color: var(--muted); font-size: .9rem; }
    .figure {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 1rem; text-align: center;
    }
    .figure img {
      max-width: 100%; height: auto;
      border: 1px solid var(--border); border-radius: 6px; background: #fff;
    }
    .meta { margin-top: .8rem; font-size: .85rem; color: var(--muted); }
    .meta a { color: var(--accent); }
    kbd {
      background: #eef1f4; border: 1px solid var(--border);
      border-bottom-width: 2px; border-radius: 4px; padding: 0 .3rem;
      font-size: .8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1><code id="title"></code></h1>
    <p><a href="plots.html">← All plots</a> &nbsp;·&nbsp;
       <a href="index.html">Home</a></p>
  </header>

  <div class="wrap">
    <div class="toolbar">
      <div class="nav">
        <a id="prev" href="#">← Previous</a>
        <a id="next" href="#">Next →</a>
      </div>
      <div class="counter"><span id="counter"></span></div>
    </div>

    <div class="figure">
      <img id="figure" alt="">
      <div class="meta">
        <a id="raw" target="_blank" rel="noopener">Open raw file</a>
        &nbsp;·&nbsp; navigate with <kbd>←</kbd> <kbd>→</kbd>
      </div>
    </div>
  </div>

  <script>
    window.PLOTS = [{"rel": "out/figs/field.png", "src": "plots/out/figs/field.png", "group": "out/figs"}, {"rel": "out/figs/profiles.png", "src": "plots/out/figs/profiles.png", "group": "out/figs"}, {"rel": "out3d_colab/figures/convergence.png", "src": "plots/out3d_colab/figures/convergence.png", "group": "out3d_colab/figures"}, {"rel": "out3d_colab/figures/test_distribution.png", "src": "plots/out3d_colab/figures/test_distribution.png", "group": "out3d_colab/figures"}, {"rel": "out3d_colab/figures/well_layout.png", "src": "plots/out3d_colab/figures/well_layout.png", "group": "out3d_colab/figures"}, {"rel": "out3d_colab/run_smoke/figures/convergence.png", "src": "plots/out3d_colab/run_smoke/figures/convergence.png", "group": "out3d_colab/run_smoke/figures"}, {"rel": "out3d_colab/run_smoke/figures/test_distribution.png", "src": "plots/out3d_colab/run_smoke/figures/test_distribution.png", "group": "out3d_colab/run_smoke/figures"}, {"rel": "out3d_colab/run_smoke/figures/well_layout.png", "src": "plots/out3d_colab/run_smoke/figures/well_layout.png", "group": "out3d_colab/run_smoke/figures"}, {"rel": "runs/sweeps/ensemble_demo/base/s0/comparison.png", "src": "plots/runs/sweeps/ensemble_demo/base/s0/comparison.png", "group": "runs/sweeps/ensemble_demo/base/s0"}, {"rel": "runs/sweeps/ensemble_demo/base/s0/loss.png", "src": "plots/runs/sweeps/ensemble_demo/base/s0/loss.png", "group": "runs/sweeps/ensemble_demo/base/s0"}, {"rel": "runs/sweeps/ensemble_demo/base/s0/profiles.png", "src": "plots/runs/sweeps/ensemble_demo/base/s0/profiles.png", "group": "runs/sweeps/ensemble_demo/base/s0"}, {"rel": "runs/sweeps/ensemble_demo/base/s1/comparison.png", "src": "plots/runs/sweeps/ensemble_demo/base/s1/comparison.png", "group": "runs/sweeps/ensemble_demo/base/s1"}, {"rel": "runs/sweeps/ensemble_demo/base/s1/loss.png", "src": "plots/runs/sweeps/ensemble_demo/base/s1/loss.png", "group": "runs/sweeps/ensemble_demo/base/s1"}, {"rel": "runs/sweeps/ensemble_demo/base/s1/profiles.png", "src": "plots/runs/sweeps/ensemble_demo/base/s1/profiles.png", "group": "runs/sweeps/ensemble_demo/base/s1"}, {"rel": "runs/sweeps/fno_coords_120ep/fno/s0/fno_loss.png", "src": "plots/runs/sweeps/fno_coords_120ep/fno/s0/fno_loss.png", "group": "runs/sweeps/fno_coords_120ep/fno/s0"}, {"rel": "runs/sweeps/fno_coords_120ep/fno/s0/fno_prediction.png", "src": "plots/runs/sweeps/fno_coords_120ep/fno/s0/fno_prediction.png", "group": "runs/sweeps/fno_coords_120ep/fno/s0"}, {"rel": "runs/sweeps/fno_coords_120ep/fno/s1/fno_loss.png", "src": "plots/runs/sweeps/fno_coords_120ep/fno/s1/fno_loss.png", "group": "runs/sweeps/fno_coords_120ep/fno/s1"}, {"rel": "runs/sweeps/fno_coords_120ep/fno/s1/fno_prediction.png", "src": "plots/runs/sweeps/fno_coords_120ep/fno/s1/fno_prediction.png", "group": "runs/sweeps/fno_coords_120ep/fno/s1"}, {"rel": "runs/sweeps/fno_coords_120ep/fno/s2/fno_loss.png", "src": "plots/runs/sweeps/fno_coords_120ep/fno/s2/fno_loss.png", "group": "runs/sweeps/fno_coords_120ep/fno/s2"}, {"rel": "runs/sweeps/fno_coords_120ep/fno/s2/fno_prediction.png", "src": "plots/runs/sweeps/fno_coords_120ep/fno/s2/fno_prediction.png", "group": "runs/sweeps/fno_coords_120ep/fno/s2"}, {"rel": "runs/sweeps/fno_coords_120ep/fno/s3/fno_loss.png", "src": "plots/runs/sweeps/fno_coords_120ep/fno/s3/fno_loss.png", "group": "runs/sweeps/fno_coords_120ep/fno/s3"}, {"rel": "runs/sweeps/fno_coords_120ep/fno/s3/fno_prediction.png", "src": "plots/runs/sweeps/fno_coords_120ep/fno/s3/fno_prediction.png", "group": "runs/sweeps/fno_coords_120ep/fno/s3"}, {"rel": "runs/sweeps/fno_coords_120ep/fno/s4/fno_loss.png", "src": "plots/runs/sweeps/fno_coords_120ep/fno/s4/fno_loss.png", "group": "runs/sweeps/fno_coords_120ep/fno/s4"}, {"rel": "runs/sweeps/fno_coords_120ep/fno/s4/fno_prediction.png", "src": "plots/runs/sweeps/fno_coords_120ep/fno/s4/fno_prediction.png", "group": "runs/sweeps/fno_coords_120ep/fno/s4"}];

    const params = new URLSearchParams(location.search);
    const rel = params.get("p");
    let idx = window.PLOTS.findIndex((p) => p.rel === rel);
    if (idx === -1) idx = 0;

    function render() {
      const p = window.PLOTS[idx];
      if (!p) return;
      document.title = p.rel + " — TESIS plot viewer";
      document.getElementById("title").textContent = p.rel;
      document.getElementById("figure").src = p.src;
      document.getElementById("figure").alt = p.rel;
      document.getElementById("raw").href = p.src;
      document.getElementById("counter").textContent =
        "Plot " + (idx + 1) + " of " + window.PLOTS.length;
      const prev = idx > 0 ? window.PLOTS[idx - 1] : null;
      const next = idx < window.PLOTS.length - 1 ? window.PLOTS[idx + 1] : null;
      const prevEl = document.getElementById("prev");
      const nextEl = document.getElementById("next");
      if (prev) {
        prevEl.href = "plot.html?p=" + encodeURIComponent(prev.rel);
        prevEl.style.visibility = "visible";
      } else prevEl.style.visibility = "hidden";
      if (next) {
        nextEl.href = "plot.html?p=" + encodeURIComponent(next.rel);
        nextEl.style.visibility = "visible";
      } else nextEl.style.visibility = "hidden";
    }

    document.addEventListener("keydown", (event) => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.key === "ArrowLeft" && idx > 0) {
        idx -= 1;
        history.replaceState(null, "", "plot.html?p=" +
          encodeURIComponent(window.PLOTS[idx].rel));
        render();
      }
      if (event.key === "ArrowRight" && idx < window.PLOTS.length - 1) {
        idx += 1;
        history.replaceState(null, "", "plot.html?p=" +
          encodeURIComponent(window.PLOTS[idx].rel));
        render();
      }
    });

    render();
  </script>
</body>
</html>
