services:
  train:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    profiles: ["cpu"]
    volumes:
      - ./out:/app/out
      - ./figs:/app/figs
    command: ["solve_1d_pinn.py", "--config", "runs/best_hardbc.json"]

  train-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./out:/app/out
      - ./figs:/app/figs
    command: ["solve_1d_pinn.py", "--config", "runs/best_hardbc.json", "--device", "cuda"]

  viewer:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    profiles: ["serve"]
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./out:/app/out:ro
      - ./figs:/app/figs:ro
    command: ["app.py", "--host", "0.0.0.0", "--port", "5000"]
